[package]
name = "opencode-agent-foundry-desktop"
version = "1.0.1"
license = "MIT"
repository = "https://github.com/gjoliveira9634/opencode-agent-foundry"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["default"] }
tauri-plugin-single-instance = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
