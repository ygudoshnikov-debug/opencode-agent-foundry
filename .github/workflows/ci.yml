name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix web

      # Typechecks both halves, runs the backend suite, the smoke test that
      # guards the architectural invariants, the web tests, the compiled-CSS
      # audit and the preset audit. The preset audit skips itself when no
      # OpenCode model catalogue is present, which is the case on a runner.
      - name: Verify
        run: npm run verify

      - name: Headless check
        run: npm run check:headless

  desktop:
    name: desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri needs the system webview and its build dependencies. Windows
      # ships WebView2, so only Linux needs this.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install
        run: |
          npm ci
          npm ci --prefix web

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the desktop binary
        run: npm run desktop:build
