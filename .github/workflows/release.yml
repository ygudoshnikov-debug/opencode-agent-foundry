name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  desktop:
    name: desktop binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: opencode-agent-foundry-desktop.exe
            asset: agent-foundry-desktop-windows-x64.exe
          - os: ubuntu-latest
            artifact: opencode-agent-foundry-desktop
            asset: agent-foundry-desktop-linux-x64
          - os: macos-latest
            artifact: opencode-agent-foundry-desktop
            asset: agent-foundry-desktop-macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install
        run: |
          npm ci
          npm ci --prefix web

      - name: Build
        run: npm run desktop:build

      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p out
          cp "src-tauri/target/release/${{ matrix.artifact }}" "out/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
