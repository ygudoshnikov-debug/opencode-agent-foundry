version: 2
updates:
  # npm dependencies at the root
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      minor-and-patch:
        dependency-type: "minor-and-patch"
      major:
        dependency-type: "major"

  # npm dependencies in web/
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      minor-and-patch:
        dependency-type: "minor-and-patch"
      major:
        dependency-type: "major"

  # Rust dependencies
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      minor-and-patch:
        dependency-type: "minor-and-patch"
      major:
        dependency-type: "major"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      minor-and-patch:
        dependency-type: "minor-and-patch"
      major:
        dependency-type: "major"
