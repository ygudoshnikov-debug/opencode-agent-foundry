name: Feature request
description: Something the plugin should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that this gets in the way of? Describe the situation rather than
        the feature — the best solution is often not the one either of us thought of first.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional. If you already have a shape in mind, describe it.

  - type: checkboxes
    id: invariants
    attributes:
      label: Invariants
      description: >
        These are load-bearing (see CONTRIBUTING.md). A request that needs one of them relaxed is
        still worth filing — just say so, so we start from the real trade-off.
      options:
        - label: This does not require naming a model in an agent's identity
        - label: This does not require a model default that applies without the user choosing it
        - label: This does not require reintroducing execution modes
