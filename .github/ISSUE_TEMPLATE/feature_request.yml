name: Feature request
description: Something the plugin should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        Describe what you are trying to accomplish and how Agent Foundry gets in the way.
        Explain the situation rather than proposing a solution — the best approach is
        often not the first one either of us thought of.
      placeholder: "Need to [goal]. Currently, [what blocks me]. Ideally, [desired outcome]."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: Optional. If you have a shape in mind, describe it.

  - type: checkboxes
    id: invariants
    attributes:
      label: Architectural constraints
      description: >
        These are load-bearing (see CONTRIBUTING.md). If your request requires relaxing one,
        file it anyway — name the trade-off and we can discuss it.
      options:
        - label: This does not require naming a model in an agent's identity
        - label: This does not require a model default that applies without the user choosing it
        - label: This does not require reintroducing execution modes
