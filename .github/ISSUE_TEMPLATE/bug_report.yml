name: Bug report
description: Something behaves differently from what it promises
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you did, what you expected, and what you got instead.
      placeholder: "Ran /foundry with objective X. Expected Y to happen, but Z happened instead."
    validations:
      required: true

  - type: textarea
    id: events
    attributes:
      label: Event log
      description: >
        The contents of `.agent-foundry/events.jsonl` for the run, if you can share it.
        This is usually sufficient to reconstruct the exact sequence of events.
      render: text

  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      placeholder: "1.18.18"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "1.0.1"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS, Linux]
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where you observed the behavior.
      options: [Chat, Desktop console, CLI, Multiple surfaces]
    validations:
      required: true
