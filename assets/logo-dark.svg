    <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#F97316" stroke-opacity="0.28" stroke-width="3"/>
    <g stroke="url(#molten)" stroke-width="9" stroke-linecap="round" fill="none">
